name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pigverse
          POSTGRES_PASSWORD: pigverse
          POSTGRES_USER: pigverse
        options: >-
          --health-cmd "pg_isready -U pigverse -d pigverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://pigverse:pigverse@127.0.0.1:5432/pigverse
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pigverse/web exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm test:e2e
      - run: pnpm db:migrate
