services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pigverse
      POSTGRES_PASSWORD: pigverse
      POSTGRES_USER: pigverse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pigverse -d pigverse"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - pigverse-postgres:/var/lib/postgresql/data

volumes:
  pigverse-postgres:
